name: Build APK
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install NDK
        run: |
          SDKM=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          if [ ! -f "$SDKM" ]; then
            SDKM=$(find /usr/local/lib/android/sdk -name sdkmanager -type f | head -n 1)
          fi
          echo "sdkmanager: $SDKM"
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "ndk;27.0.12077973" "cmake;3.22.1" "build-tools;36.0.0" "platforms;android-36"

      - name: Create keystore
        run: |
          rm -f TMessagesProj/config/release.keystore
          keytool -genkeypair -v -keystore TMessagesProj/config/release.keystore \
            -alias mykey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass mypass123 -keypass mypass123 -dname "CN=Wanda"

      - name: Set gradle props
        run: |
          echo "RELEASE_STORE_PASSWORD=mypass123" >> gradle.properties
          echo "RELEASE_KEY_ALIAS=mykey" >> gradle.properties
          echo "RELEASE_KEY_PASSWORD=mypass123" >> gradle.properties

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleArm64Release --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
